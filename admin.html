*{box-sizing:border-box;margin:0}body{font:15px/1.45 system-ui,Inter,sans-serif;background:#f4f4ef;color:#1b1816}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 14px;background:#1b1816;color:#fff}
header b{flex:1}header a{color:#f4c542;text-decoration:none}#st{font-size:12px;color:#7be0a0}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:2px solid #1b1816;position:sticky;top:44px;z-index:4}
nav button{flex:none;border:2px solid #1b1816;background:#fff;padding:8px 12px;font:700 12px monospace;text-transform:uppercase;cursor:pointer}
nav button.on{background:#f4c542}
main{max-width:780px;margin:0 auto;padding:14px}
.box{background:#fff;border:2px solid #1b1816;box-shadow:4px 4px 0 #1b1816;padding:14px;margin-bottom:16px}
h2{font-size:18px;margin-bottom:10px}h3{font-size:15px;margin-bottom:8px}
label{display:block;font:700 11px monospace;text-transform:uppercase;margin:10px 0 3px}
input,textarea,select{width:100%;font:15px system-ui;padding:9px 10px;border:2px solid #1b1816;background:#fbfbf8;border-radius:0}
input[type=range]{padding:0;height:26px;border:0;background:none}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1}input[type=color]{padding:2px;height:40px}
button.b{border:2px solid #1b1816;background:#1b1816;color:#fff;padding:9px 12px;font:700 12px monospace;text-transform:uppercase;cursor:pointer}
button.b.y{background:#f4c542;color:#1b1816}button.b.r{background:#e0473a;border-color:#e0473a}
.th{width:120px;height:140px;background:#ddd center/cover no-repeat;border:2px solid #1b1816;margin:6px 0;display:grid;place-items:center;font-size:11px;color:#666;text-align:center}
.th.wide{width:100%;max-width:300px;height:170px;background-position:top center}
.pj{border-left:6px solid #f4c542}.pj.app{border-left-color:#2fae6f}.hint{font-size:13px;color:#555;margin-top:8px}
.tag{display:inline-block;font:700 10px monospace;text-transform:uppercase;background:#1b1816;color:#fff;padding:2px 6px;margin-left:6px;vertical-align:middle}
code,pre{font:12px/1.4 monospace;background:#f0f0e8;padding:2px 5px;display:block;white-space:pre-wrap;word-break:break-all;margin:6px 0;border:1px solid #ccc}
iframe{width:100%;height:78vh;border:2px solid #1b1816;background:#fff}
header{padding:8px 14px;flex-wrap:wrap}header button.b{padding:5px 8px;font-size:11px;border-color:#fff}#cl{font-size:11px;color:#f4c542}
nav{top:48px}nav button.dirty:after{content:" •";color:#e0473a}
button:disabled{opacity:.4;cursor:not-allowed}
button.b.g{background:#2fae6f;border-color:#2fae6f}button.b.o{background:#777;border-color:#777}
.sv{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:2px solid #1b1816;box-shadow:4px 4px 0 #1b1816;padding:10px;margin-top:10px;z-index:3}
.sv span{flex:1;font:700 12px monospace;min-width:140px}.sv.dirty{background:#fff4c2}
